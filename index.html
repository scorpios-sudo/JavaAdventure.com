<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#0A0F1F">
    <title>Trader X Academy | Pro Profile + Multi Account</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif;
            background: #0A0F1F;
            color: #E2E8F0;
            overflow-x: hidden;
            padding-bottom: 80px;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #1E293B; }
        ::-webkit-scrollbar-thumb { background: #00FFAA; border-radius: 10px; }

        .app {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0F172A, #0A0F1F);
        }
        .page {
            animation: fadeIn 0.25s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .container { padding: 20px 18px 30px; }

        /* Card glassmorphism */
        .card {
            background: rgba(18, 25, 45, 0.65);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(0, 255, 170, 0.25);
            padding: 18px 20px;
            margin-bottom: 18px;
            transition: all 0.2s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .card:hover {
            border-color: #00FFAA;
            transform: translateY(-2px);
        }
        .btn {
            border: none;
            border-radius: 44px;
            padding: 12px 20px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: 0.15s;
        }
        .btn-primary {
            background: linear-gradient(95deg, #00FFAA, #00D4FF);
            color: #0A0F1F;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #00FFAA;
            color: #00FFAA;
        }
        .btn-small {
            width: auto;
            padding: 8px 16px;
            font-size: 13px;
        }
        input, select {
            width: 100%;
            padding: 14px 16px;
            background: #0F1422;
            border: 1px solid #2D3A5E;
            border-radius: 28px;
            color: white;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
        }
        input:focus { border-color: #00FFAA; }

        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .flex-start { display: flex; align-items: center; gap: 12px; }
        .mt-2 { margin-top: 12px; }
        .mb-2 { margin-bottom: 12px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }

        .quick-btn {
            background: linear-gradient(95deg, #1E2A47, #0F172A);
            border: 1px solid #00FFAA;
            border-radius: 40px;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }
        .quick-btn:active { transform: scale(0.97); }
        .stat-value { font-size: 28px; font-weight: 800; color: #00FFAA; }

        .market-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1E293B;
        }
        .up { color: #00FFAA; }
        .down { color: #FF4466; }

        /* Avatar */
        .avatar-large {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #00FFAA, #00D4FF);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            font-weight: bold;
            color: #0A0F1F;
            overflow: hidden;
            cursor: pointer;
        }
        .avatar-large img { width: 100%; height: 100%; object-fit: cover; }

        /* Account card */
        .account-card {
            background: rgba(0,255,170,0.05);
            border-radius: 24px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .stat-badge {
            background: #1E293B;
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 12px;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: rgba(10, 15, 31, 0.96);
            backdrop-filter: blur(20px);
            display: flex;
            justify-content: space-around;
            padding: 8px 12px 22px;
            border-top: 1px solid rgba(0,255,170,0.3);
            z-index: 100;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: none;
            border: none;
            color: #7E8AA8;
            font-size: 11px;
            gap: 4px;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 30px;
        }
        .nav-item.active { color: #00FFAA; background: rgba(0,255,170,0.12); }
        .nav-item span:first-child { font-size: 22px; }

        .badge-premium { background: #00FFAA; color: #0A0F1F; }
        .badge { display: inline-flex; padding: 4px 12px; border-radius: 30px; font-size: 11px; font-weight: 600; }
        .toast {
            position: fixed;
            bottom: 90px;
            left: 20px;
            right: 20px;
            background: #1E293B;
            border-left: 4px solid #00FFAA;
            padding: 14px;
            border-radius: 28px;
            z-index: 1500;
            animation: slideUp 0.3s;
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal-content {
            background: #111827;
            border-radius: 36px;
            max-width: 90%;
            width: 380px;
            padding: 24px;
            border: 1px solid #00FFAA;
        }
        .profit-positive { color: #00FFAA; }
        .profit-negative { color: #FF4466; }
        hr { border-color: #2D3A5E; margin: 12px 0; }
    </style>
</head>
<body>
<div class="app" id="appRoot"></div>

<script>
    // ======================== STORAGE ========================
    const STORAGE = {
        USERS: "traderX_users",
        CURRENT: "traderX_current",
        SIGNALS: "traderX_signals",
        JOURNALS: "traderX_journals",
        ACTIVITIES: "traderX_activities",
        EDU_PROGRESS: "traderX_edu_progress"
    };

    // Default signals & activities
    const defaultSignals = [
        { id: "s1", pair: "BTC/USD", entry: "43200", tp: "45000", sl: "42500", status: "OPEN", premium: true, createdAt: Date.now() - 3600000 },
        { id: "s2", pair: "XAUUSD", entry: "1985", tp: "2000", sl: "1970", status: "WIN", premium: false, createdAt: Date.now() - 86400000 },
        { id: "s3", pair: "EUR/USD", entry: "1.0890", tp: "1.0950", sl: "1.0850", status: "LOSS", premium: false, createdAt: Date.now() - 172800000 }
    ];
    const defaultActivities = [
        { id: "act1", text: "🔥 Kamu profit +$20 di EURUSD", timestamp: Date.now() - 7200000 },
        { id: "act2", text: "📡 Signal BTC Aktif: Entry 43200", timestamp: Date.now() - 3600000 }
    ];

    // Education data (singkat)
    const educationData = [
        { id: "edu1", title: "Teknik Manajemen Risiko", desc: "Manajemen risiko adalah upaya menyeimbangkan...", level: "Pemula", premium: false, readCount: 1, content: "Jangan risk lebih dari 2% per trade." },
        { id: "edu2", title: "Apa Itu Candlestick?", desc: "Pelajari komponen utama candlestick...", level: "Pemula", premium: false, readCount: 1, content: "Candlestick berasal dari Jepang." }
    ];

    function initStorage() {
        if (!localStorage.getItem(STORAGE.USERS)) {
            // Default user dengan multiple accounts (seperti gambar)
            const defaultUser = {
                email: "demo@traderx.com",
                password: "demo123",
                name: "Condex.s",
                role: "free",
                avatar: "",
                balance: 12500,
                profitToday: 340,
                totalTrades: 28,
                winrate: 64,
                tradingAccounts: [
                    {
                        id: "acc1",
                        name: "Condex.s",
                        startingBalance: 20,
                        currentBalance: 31,
                        visible: true,
                        tradesCount: 1,
                        winRate: 100,
                        strongestPair: "XAUUSD",
                        allTimeHigh: 11.00,
                        psychologyStrength: "Confident",
                        psychologyWeakness: "No data yet"
                    }
                ]
            };
            localStorage.setItem(STORAGE.USERS, JSON.stringify([defaultUser]));
        }
        if (!localStorage.getItem(STORAGE.SIGNALS)) localStorage.setItem(STORAGE.SIGNALS, JSON.stringify(defaultSignals));
        if (!localStorage.getItem(STORAGE.JOURNALS)) localStorage.setItem(STORAGE.JOURNALS, JSON.stringify([]));
        if (!localStorage.getItem(STORAGE.ACTIVITIES)) localStorage.setItem(STORAGE.ACTIVITIES, JSON.stringify(defaultActivities));
        if (!localStorage.getItem(STORAGE.EDU_PROGRESS)) localStorage.setItem(STORAGE.EDU_PROGRESS, JSON.stringify({}));
    }
    initStorage();

    let currentUser = JSON.parse(localStorage.getItem(STORAGE.CURRENT));
    let currentPage = "home";
    let liveInterval = null;

    function getUsers() { return JSON.parse(localStorage.getItem(STORAGE.USERS)); }
    function saveUser(user) {
        let users = getUsers();
        const idx = users.findIndex(u => u.email === user.email);
        if (idx !== -1) users[idx] = user;
        localStorage.setItem(STORAGE.USERS, JSON.stringify(users));
        localStorage.setItem(STORAGE.CURRENT, JSON.stringify(user));
        currentUser = user;
    }
    function showToast(msg, isError = false) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `${isError ? '⚠️ ' : '✅ '}${msg}`;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2600);
    }
    function addActivity(text) {
        let acts = JSON.parse(localStorage.getItem(STORAGE.ACTIVITIES));
        acts.unshift({ id: Date.now(), text, timestamp: Date.now() });
        if (acts.length > 15) acts.pop();
        localStorage.setItem(STORAGE.ACTIVITIES, JSON.stringify(acts));
    }

    // ======================== RENDER ========================
    function render() {
        if (!currentUser) { renderAuth(); return; }
        const root = document.getElementById('appRoot');
        let content = '';
        switch (currentPage) {
            case 'home': content = renderHome(); break;
            case 'signals': content = renderSignals(); break;
            case 'journal': content = renderJournal(); break;
            case 'calculator': content = renderCalculator(); break;
            case 'education': content = renderEducation(); break;
            case 'membership': content = renderMembership(); break;
            case 'profile': content = renderProfile(); break;
            default: content = renderHome();
        }
        root.innerHTML = content + renderBottomNav();
        attachNavEvents();
        attachPageEvents();
        if (currentPage === 'home') startLiveUpdates();
        else if (liveInterval) clearInterval(liveInterval);
    }

    // ======================== AUTH ========================
    function renderAuth() {
        const root = document.getElementById('appRoot');
        root.innerHTML = `
            <div class="container" style="padding: 40px 20px;">
                <div class="card" style="text-align:center;">
                    <h1 style="font-size: 32px; background:linear-gradient(135deg,#00FFAA,#00D4FF); -webkit-background-clip:text; background-clip:text; color:transparent;">Trader X Academy</h1>
                    <p class="mt-2">Multi-Account + Pro Profile</p>
                </div>
                <div class="card" id="authBox">
                    <h3 id="authTitle">Login</h3>
                    <input type="text" id="authName" placeholder="Nama" style="display:none;">
                    <input type="email" id="authEmail" placeholder="Email">
                    <input type="password" id="authPass" placeholder="Password">
                    <button class="btn btn-primary" id="authBtn">Login</button>
                    <p class="flex-between mt-2"><a href="#" id="switchAuth" style="color:#00FFAA;">Belum punya akun? Daftar</a></p>
                    <p class="small" style="font-size:12px; text-align:center;">demo@traderx.com / demo123</p>
                </div>
            </div>
        `;
        let isLogin = true;
        const title = document.getElementById('authTitle');
        const btn = document.getElementById('authBtn');
        const switchLink = document.getElementById('switchAuth');
        const nameField = document.getElementById('authName');
        const emailInp = document.getElementById('authEmail');
        const passInp = document.getElementById('authPass');

        function handleAuth() {
            const email = emailInp.value.trim();
            const pass = passInp.value.trim();
            if (!email || !pass) return showToast("Isi semua field", true);
            const users = getUsers();
            if (isLogin) {
                const user = users.find(u => u.email === email && u.password === pass);
                if (user) {
                    localStorage.setItem(STORAGE.CURRENT, JSON.stringify(user));
                    currentUser = user;
                    showToast(`Selamat datang ${user.name}`);
                    render();
                } else showToast("Email atau password salah", true);
            } else {
                if (users.find(u => u.email === email)) return showToast("Email sudah terdaftar", true);
                const name = nameField.value.trim() || email.split('@')[0];
                const newUser = { 
                    email, password: pass, name, role: "free", avatar: "", balance: 5000, profitToday: 0, totalTrades: 0, winrate: 0,
                    tradingAccounts: [{
                        id: "acc1", name: name, startingBalance: 20, currentBalance: 20, visible: true,
                        tradesCount: 0, winRate: 0, strongestPair: "-", allTimeHigh: 0,
                        psychologyStrength: "Calm", psychologyWeakness: "No data"
                    }]
                };
                users.push(newUser);
                localStorage.setItem(STORAGE.USERS, JSON.stringify(users));
                showToast("Registrasi berhasil, silakan login");
                isLogin = true;
                title.innerText = "Login";
                btn.innerText = "Login";
                switchLink.innerText = "Belum punya akun? Daftar";
                nameField.style.display = "none";
                emailInp.value = email;
                passInp.value = "";
            }
        }
        btn.onclick = handleAuth;
        switchLink.onclick = (e) => {
            e.preventDefault();
            isLogin = !isLogin;
            title.innerText = isLogin ? "Login" : "Register";
            btn.innerText = isLogin ? "Login" : "Daftar";
            switchLink.innerText = isLogin ? "Belum punya akun? Daftar" : "Sudah punya akun? Login";
            nameField.style.display = isLogin ? "none" : "block";
        };
    }

    // ======================== HOME (ringkas) ========================
    function renderHome() {
        const journals = JSON.parse(localStorage.getItem(STORAGE.JOURNALS)).filter(j => j.userEmail === currentUser.email);
        const totalTrades = journals.length;
        const wins = journals.filter(j => j.profit > 0).length;
        const winrate = totalTrades ? ((wins / totalTrades) * 100).toFixed(0) : 0;
        currentUser.totalTrades = totalTrades;
        currentUser.winrate = parseInt(winrate);
        currentUser.profitToday = journals.filter(j => new Date(j.date).toDateString() === new Date().toDateString()).reduce((s,j)=>s+j.profit,0);
        saveUser(currentUser);
        return `
            <div class="container page">
                <div class="flex-between">
                    <div><h2>Welcome, ${currentUser.name}</h2><p>${currentUser.role === 'premium' ? '💎 Premium' : '🆓 Free'}</p></div>
                    <div class="badge ${currentUser.role === 'premium' ? 'badge-premium' : ''}">${currentUser.role.toUpperCase()}</div>
                </div>
                <div class="card">
                    <div class="flex-between"><span>💰 Balance</span><span class="stat-value">$${currentUser.balance}</span></div>
                    <div class="flex-between"><span>📈 Today Profit</span><span class="${currentUser.profitToday>=0?'profit-positive':'profit-negative'}">$${currentUser.profitToday}</span></div>
                    <div class="flex-between"><span>📊 Total Trades</span><span>${currentUser.totalTrades}</span></div>
                    <div class="flex-between"><span>🏆 Winrate</span><span>${currentUser.winrate}%</span></div>
                </div>
                <div class="grid-2">
                    <div class="quick-btn" data-nav="calculator">🧮 Kalkulator</div>
                    <div class="quick-btn" data-nav="journal">📓 Jurnal</div>
                    <div class="quick-btn" data-nav="signals">📡 Signal</div>
                    <div class="quick-btn" data-nav="profile">👤 Profile</div>
                </div>
                <div class="card">
                    <div class="flex-between"><span>🌍 Market Snapshot</span><span id="liveMarketTime"></span></div>
                    <div id="liveMarketData"><div class="market-item">BTC/USD <span class="up">+2.4%</span></div><div class="market-item">XAUUSD <span class="up">+0.8%</span></div><div class="market-item">EUR/USD <span class="down">-0.3%</span></div></div>
                </div>
            </div>
        `;
    }
    function startLiveUpdates() {
        if (liveInterval) clearInterval(liveInterval);
        liveInterval = setInterval(() => {
            const btc = (Math.random() * 3 - 1).toFixed(1);
            const gold = (Math.random() * 2 - 0.5).toFixed(1);
            const eur = (Math.random() * 2 - 1).toFixed(1);
            const marketDiv = document.getElementById('liveMarketData');
            if (marketDiv) marketDiv.innerHTML = `<div class="market-item">BTC/USD <span class="${btc>=0?'up':'down'}">${btc>=0?'+':''}${btc}%</span></div><div class="market-item">XAUUSD <span class="${gold>=0?'up':'down'}">${gold>=0?'+':''}${gold}%</span></div><div class="market-item">EUR/USD <span class="${eur>=0?'up':'down'}">${eur>=0?'+':''}${eur}%</span></div>`;
            const timeSpan = document.getElementById('liveMarketTime');
            if (timeSpan) timeSpan.innerText = new Date().toLocaleTimeString();
        }, 10000);
    }

    // ======================== PROFILE LENGKAP (seperti gambar) ========================
    function renderProfile() {
        const accounts = currentUser.tradingAccounts || [];
        const mainAccount = accounts.find(a => a.visible) || accounts[0];
        const avatarHtml = currentUser.avatar ? `<img src="${currentUser.avatar}">` : `<span>${(currentUser.name || 'U').charAt(0).toUpperCase()}</span>`;
        return `
            <div class="container page">
                <h2>👤 Profile & Accounts</h2>
                <!-- Avatar & Nama -->
                <div class="card">
                    <div class="flex-start">
                        <div class="avatar-large" id="avatarClick">${avatarHtml}</div>
                        <div><h3>${currentUser.name}</h3><p class="small">${currentUser.email}</p><button id="editProfileBtn" class="btn-small btn-outline">Edit Profile</button></div>
                    </div>
                </div>
                <!-- Statistik Akun -->
                <div class="card">
                    <div class="flex-between"><span>📊 TRADES</span><span class="stat-value">${mainAccount?.tradesCount || 0}</span></div>
                    <div class="flex-between"><span>🏆 WIN RATE</span><span>${mainAccount?.winRate || 0}%</span></div>
                    <div class="flex-between"><span>📁 ACCOUNTS</span><span>${accounts.length}</span></div>
                    <div class="flex-between"><span>💪 STRONGEST PAIR</span><span>${mainAccount?.strongestPair || '-'}</span></div>
                    <div class="flex-between"><span>🏅 ALL-TIME HIGH</span><span>$${mainAccount?.allTimeHigh || 0}</span></div>
                    <hr>
                    <div class="flex-between"><span>🧠 Psychology Strength</span><span>${mainAccount?.psychologyStrength || 'Calm'}</span></div>
                    <div class="flex-between"><span>😓 Weakness</span><span>${mainAccount?.psychologyWeakness || 'No data'}</span></div>
                </div>
                <!-- Cloud Sync Simulation -->
                <div class="card">
                    <div class="flex-between"><span>☁️ Cloud Sync</span><span class="badge">Offline only</span></div>
                    <p class="small">Offline only (not backed up). Sign in to back up your trades across devices.</p>
                    <button id="cloudSyncBtn" class="btn-outline btn-small">Sign In / Sign Up</button>
                </div>
                <!-- Trading Accounts List -->
                <div class="card">
                    <div class="flex-between"><span>💰 Trading Accounts</span><button id="addAccountBtn" class="btn-small btn-outline">+ Add Account</button></div>
                    <div id="accountsList">
                        ${accounts.map(acc => `
                            <div class="account-card">
                                <div class="flex-between">
                                    <div><b>${acc.name}</b> ${acc.visible ? '<span class="badge">Visible</span>' : '<span class="badge">Hidden</span>'}</div>
                                    <button class="toggleVisibilityBtn btn-small btn-outline" data-id="${acc.id}">${acc.visible ? 'Hide' : 'Show'}</button>
                                </div>
                                <div class="flex-between mt-2"><span>STARTING: $${acc.startingBalance}</span><span>CURRENT: $${acc.currentBalance}</span></div>
                                <div class="flex-between mt-2">
                                    <button class="depositBtn btn-small btn-primary" data-id="${acc.id}">Deposit</button>
                                    <button class="withdrawBtn btn-small btn-outline" data-id="${acc.id}">Withdraw</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                <!-- Theme & Support -->
                <div class="card">
                    <div class="flex-between"><span>🎨 Theme & Support</span></div>
                    <button id="exportDataBtn" class="btn-outline btn-small mt-2">Export Journal Data</button>
                    <button id="restoreDataBtn" class="btn-outline btn-small mt-2">Restore Data</button>
                    <button id="requestFeatureBtn" class="btn-outline btn-small mt-2">Request a feature</button>
                    <p class="small mt-2">Thanks for community feedback! ❤️</p>
                </div>
                <button id="logoutBtn" class="btn-outline mt-2">Logout</button>
            </div>
        `;
    }

    // Event handlers untuk profile
    function attachProfileEvents() {
        // Avatar upload
        const avatarEl = document.getElementById('avatarClick');
        if (avatarEl) avatarEl.onclick = () => {
            const modal = document.createElement('div'); modal.className = 'modal';
            modal.innerHTML = `<div class="modal-content"><h3>Choose Avatar</h3><input type="file" id="avatarUpload" accept="image/*"><button id="uploadAvatarBtn" class="btn-primary mt-2">Upload Your Photo</button><button id="cancelAvatar" class="btn-outline mt-2">Cancel</button></div>`;
            document.body.appendChild(modal);
            document.getElementById('uploadAvatarBtn').onclick = () => {
                const file = document.getElementById('avatarUpload').files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        currentUser.avatar = e.target.result;
                        saveUser(currentUser);
                        showToast("Avatar updated");
                        modal.remove();
                        render();
                    };
                    reader.readAsDataURL(file);
                } else showToast("Pilih file gambar", true);
            };
            document.getElementById('cancelAvatar').onclick = () => modal.remove();
        };
        // Edit profile (nama, email)
        document.getElementById('editProfileBtn')?.addEventListener('click', () => {
            const newName = prompt("Nama baru", currentUser.name);
            if (newName) { currentUser.name = newName; saveUser(currentUser); render(); }
            const newEmail = prompt("Email baru", currentUser.email);
            if (newEmail) { currentUser.email = newEmail; saveUser(currentUser); render(); }
        });
        // Cloud sync simulation
        document.getElementById('cloudSyncBtn')?.addEventListener('click', () => showToast("Cloud sync coming soon! (Simulasi)"));
        // Add account
        document.getElementById('addAccountBtn')?.addEventListener('click', () => {
            const name = prompt("Nama akun baru:", "My Account");
            if (name) {
                const newAcc = {
                    id: "acc"+Date.now(),
                    name: name,
                    startingBalance: 0,
                    currentBalance: 0,
                    visible: true,
                    tradesCount: 0,
                    winRate: 0,
                    strongestPair: "-",
                    allTimeHigh: 0,
                    psychologyStrength: "Calm",
                    psychologyWeakness: "No data"
                };
                currentUser.tradingAccounts.push(newAcc);
                saveUser(currentUser);
                addActivity(`Menambahkan akun trading: ${name}`);
                render();
            }
        });
        // Toggle visibility, deposit, withdraw
        document.querySelectorAll('.toggleVisibilityBtn').forEach(btn => {
            btn.onclick = () => {
                const id = btn.dataset.id;
                const acc = currentUser.tradingAccounts.find(a => a.id === id);
                if (acc) acc.visible = !acc.visible;
                saveUser(currentUser);
                render();
            };
        });
        document.querySelectorAll('.depositBtn').forEach(btn => {
            btn.onclick = () => {
                const id = btn.dataset.id;
                const acc = currentUser.tradingAccounts.find(a => a.id === id);
                const amount = parseFloat(prompt("Jumlah deposit (USD):", "100"));
                if (!isNaN(amount) && amount > 0) {
                    acc.currentBalance += amount;
                    acc.startingBalance = acc.currentBalance - (acc.currentBalance - acc.startingBalance);
                    if (acc.currentBalance > acc.allTimeHigh) acc.allTimeHigh = acc.currentBalance;
                    saveUser(currentUser);
                    addActivity(`Deposit $${amount} ke akun ${acc.name}`);
                    render();
                }
            };
        });
        document.querySelectorAll('.withdrawBtn').forEach(btn => {
            btn.onclick = () => {
                const id = btn.dataset.id;
                const acc = currentUser.tradingAccounts.find(a => a.id === id);
                const amount = parseFloat(prompt("Jumlah withdraw (USD):", "50"));
                if (!isNaN(amount) && amount > 0 && amount <= acc.currentBalance) {
                    acc.currentBalance -= amount;
                    saveUser(currentUser);
                    addActivity(`Withdraw $${amount} dari akun ${acc.name}`);
                    render();
                } else showToast("Saldo tidak cukup", true);
            };
        });
        // Export data (simulasi download JSON)
        document.getElementById('exportDataBtn')?.addEventListener('click', () => {
            const data = {
                user: { name: currentUser.name, email: currentUser.email, role: currentUser.role },
                journals: JSON.parse(localStorage.getItem(STORAGE.JOURNALS)).filter(j => j.userEmail === currentUser.email),
                accounts: currentUser.tradingAccounts
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `traderx_backup_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast("Data exported!");
        });
        // Restore data (simulasi upload)
        document.getElementById('restoreDataBtn')?.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = (e) => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = (ev) => {
                    try {
                        const restored = JSON.parse(ev.target.result);
                        if (restored.journals) {
                            let journals = JSON.parse(localStorage.getItem(STORAGE.JOURNALS));
                            journals = journals.filter(j => j.userEmail !== currentUser.email);
                            journals.push(...restored.journals.map(j => ({...j, userEmail: currentUser.email})));
                            localStorage.setItem(STORAGE.JOURNALS, JSON.stringify(journals));
                            showToast("Journal restored!");
                            render();
                        } else showToast("Format tidak valid", true);
                    } catch(err) { showToast("Gagal restore", true); }
                };
                reader.readAsText(file);
            };
            input.click();
        });
        document.getElementById('requestFeatureBtn')?.addEventListener('click', () => showToast("Fitur request: kirim email ke support@traderx.com"));
        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            localStorage.removeItem(STORAGE.CURRENT);
            currentUser = null;
            render();
        });
    }

    // ======================== SIGNAL, JURNAL, KALKULATOR, EDUKASI (ringkas) ========================
    function renderSignals() {
        let signals = JSON.parse(localStorage.getItem(STORAGE.SIGNALS));
        signals.sort((a,b) => b.createdAt - a.createdAt);
        return `<div class="container page"><h2>📡 Signal Trading</h2>${signals.map(s => `<div class="card"><div class="flex-between"><b>${s.pair}</b>${s.premium ? '<span class="badge-premium">PREMIUM</span>' : ''}</div><div>Entry: ${s.entry} | TP: ${s.tp} | SL: ${s.sl}</div><div>Status: ${s.status}</div></div>`).join('')}</div>`;
    }
    function renderJournal() {
        let journals = JSON.parse(localStorage.getItem(STORAGE.JOURNALS)).filter(j => j.userEmail === currentUser.email);
        return `<div class="container page"><div class="flex-between"><h2>📓 Trading Journal</h2><button id="addJournalBtn" class="btn-primary" style="width:auto;">+</button></div><div id="journalList">${journals.slice().reverse().map(j => `<div class="card"><div class="flex-between"><b>${j.pair}</b><span class="${j.profit>=0?'profit-positive':'profit-negative'}">$${j.profit}</span></div><div class="small">${new Date(j.date).toLocaleString()}</div><button class="delJournal btn-outline" data-id="${j.id}">Hapus</button></div>`).join('')}</div></div>`;
    }
    function attachJournalEvents() {
        document.getElementById('addJournalBtn')?.addEventListener('click', () => {
            const modal = document.createElement('div'); modal.className = 'modal';
            modal.innerHTML = `<div class="modal-content"><h3>New Trade</h3><input id="jPair" placeholder="Pair"><input id="jProfit" type="number" placeholder="Profit/Loss USD"><button id="saveJournal" class="btn-primary">Simpan</button><button id="closeJournal" class="btn-outline">Batal</button></div>`;
            document.body.appendChild(modal);
            document.getElementById('saveJournal').onclick = () => {
                let journals = JSON.parse(localStorage.getItem(STORAGE.JOURNALS));
                journals.push({ id: Date.now(), userEmail: currentUser.email, pair: document.getElementById('jPair').value, profit: parseFloat(document.getElementById('jProfit').value), date: Date.now() });
                localStorage.setItem(STORAGE.JOURNALS, JSON.stringify(journals));
                // update account stats (sederhana)
                const mainAcc = currentUser.tradingAccounts[0];
                if (mainAcc) {
                    mainAcc.tradesCount += 1;
                    const allJournals = journals.filter(j => j.userEmail === currentUser.email);
                    const wins = allJournals.filter(j => j.profit > 0).length;
                    mainAcc.winRate = Math.round((wins / mainAcc.tradesCount) * 100);
                    mainAcc.currentBalance += parseFloat(document.getElementById('jProfit').value);
                    if (mainAcc.currentBalance > mainAcc.allTimeHigh) mainAcc.allTimeHigh = mainAcc.currentBalance;
                    saveUser(currentUser);
                }
                addActivity(`Trade ${document.getElementById('jPair').value} profit $${document.getElementById('jProfit').value}`);
                modal.remove(); render();
            };
            document.getElementById('closeJournal').onclick = () => modal.remove();
        });
        document.querySelectorAll('.delJournal').forEach(btn => btn.onclick = () => {
            let id = btn.dataset.id;
            let journals = JSON.parse(localStorage.getItem(STORAGE.JOURNALS));
            journals = journals.filter(j => j.id != id);
            localStorage.setItem(STORAGE.JOURNALS, JSON.stringify(journals));
            render();
        });
    }
    function renderCalculator() {
        return `<div class="container page"><h2>🧮 Forex Calculator</h2><div class="card"><input id="calcBalance" placeholder="Balance"><input id="calcRisk" placeholder="Risk %"><button id="calcBtn" class="btn-primary">Hitung</button><div id="calcResult" class="mt-2"></div></div></div>`;
    }
    function attachCalculatorEvents() {
        document.getElementById('calcBtn')?.addEventListener('click', () => {
            let bal = parseFloat(document.getElementById('calcBalance').value);
            let risk = parseFloat(document.getElementById('calcRisk').value);
            if (!isNaN(bal) && !isNaN(risk)) {
                let lot = (bal * (risk/100) / 100).toFixed(2);
                document.getElementById('calcResult').innerHTML = `<span class="profit-positive">Lot rekomendasi: ${lot}</span>`;
            }
        });
    }
    function renderEducation() {
        return `<div class="container page"><h2>📘 Edukasi</h2>${educationData.map(e => `<div class="card"><div class="flex-between"><b>${e.title}</b>${e.premium ? '<span class="badge-premium">PREMIUM</span>' : ''}</div><p class="small">${e.desc}</p></div>`).join('')}</div>`;
    }
    function renderMembership() { return `<div class="container page"><h2>👑 Membership</h2><div class="card"><h3>${currentUser.role === 'premium' ? 'Premium' : 'Free'}</h3><button id="upgradeBtn" class="btn-primary">Upgrade Premium</button></div></div>`; }
    function attachMembershipEvents() { document.getElementById('upgradeBtn')?.addEventListener('click', () => { currentUser.role = 'premium'; saveUser(currentUser); showToast("Premium aktif!"); render(); }); }

    // ======================== NAVIGATION ========================
    function renderBottomNav() {
        const items = [
            { id: 'home', icon: '🏠', label: 'Home' },
            { id: 'signals', icon: '📊', label: 'Signal' },
            { id: 'journal', icon: '📓', label: 'Journal' },
            { id: 'calculator', icon: '🧮', label: 'Calc' },
            { id: 'profile', icon: '👤', label: 'Profile' }
        ];
        return `<div class="bottom-nav">${items.map(item => `<button class="nav-item ${currentPage === item.id ? 'active' : ''}" data-nav="${item.id}"><span>${item.icon}</span><span>${item.label}</span></button>`).join('')}</div>`;
    }
    function attachNavEvents() {
        document.querySelectorAll('[data-nav]').forEach(el => {
            el.addEventListener('click', (e) => { const nav = el.dataset.nav; if (nav) { currentPage = nav; render(); } });
        });
        if (currentPage === 'journal') attachJournalEvents();
        if (currentPage === 'calculator') attachCalculatorEvents();
        if (currentPage === 'membership') attachMembershipEvents();
        if (currentPage === 'profile') attachProfileEvents();
    }
    function attachPageEvents() {}

    render();
</script>
</body>
</html>
