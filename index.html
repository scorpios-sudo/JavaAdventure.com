<script>
    // ---------- GLOBALS ----------
    let journalEntries = [];
    let isPremium = false;
    let userName = "Alex Trader";
    let userEmail = "demo@traderx.com";
    let balanceStarting = 10000;
    let chartInstance = null;
    let activities = [];
    let marketPrices = { BTC: 68250, GOLD: 2350, EURUSD: 1.0852 };
    let signalsArray = [];
    let loggedIn = false;

    // ---------- Helper Functions ----------
    function buildSignals() {
        return [
            { id: 1, pair: "BTC/USD", entry: 68400, tp: 69200, sl: 67800, status: "OPEN", createdAt: Date.now() - 86400000, premiumLocked: false },
            { id: 2, pair: "EUR/USD", entry: 1.0865, tp: 1.0920, sl: 1.0820, status: "WIN", createdAt: Date.now() - 172800000, premiumLocked: false },
            { id: 3, pair: "XAU/USD", entry: 2345, tp: 2360, sl: 2330, status: "OPEN", createdAt: Date.now() - 43200000, premiumLocked: false },
            { id: 4, pair: "ETH/USD", entry: 3210, tp: 3350, sl: 3150, status: "OPEN", createdAt: Date.now() - 21600000, premiumLocked: true },
            { id: 5, pair: "GBP/JPY", entry: 192.5, tp: 194.2, sl: 191.2, status: "LOSS", createdAt: Date.now() - 10800000, premiumLocked: true },
            { id: 6, pair: "SOL/USD", entry: 165.4, tp: 175.2, sl: 160.1, status: "WIN", createdAt: Date.now() - 3600000, premiumLocked: true },
        ];
    }
    const newsData = [
        { id: 1, title: "Fed signals rate cut, crypto rallies", category: "Crypto", image: "https://picsum.photos/id/26/100/100", date: "2h ago", source: "Bloomberg" },
        { id: 2, title: "Gold hits new record amid inflation fears", category: "Gold", image: "https://picsum.photos/id/29/100/100", date: "5h ago", source: "Reuters" },
        { id: 3, title: "EURUSD volatility ahead of ECB", category: "Forex", image: "https://picsum.photos/id/35/100/100", date: "Yesterday", source: "FT" },
    ];
    // Education data
    const eduVideos = [
        { id: "dQw4w9WgXcQ", title: "Market Structure Pro" },
        { id: "JfVOs4VSpmA", title: "Risk Management Core" },
        { id: "3nXLaO--DqM", title: "Trading Psychology" },
    ];
    const eduModules = [
        { id: 1, title: "Smart Money Concepts", desc: "Institutional order flow", premiumLocked: false },
        { id: 2, title: "Advanced Risk Management", desc: "Position sizing & drawdown", premiumLocked: false },
        { id: 3, title: "Entry Precision Strategy", desc: "High probability setups", premiumLocked: true },
        { id: 4, title: "Market Profile & Volume", desc: "Auction theory", premiumLocked: true },
    ];

    function loadStorage() {
        const storedJournal = localStorage.getItem("traderx_journal");
        if(storedJournal) journalEntries = JSON.parse(storedJournal);
        else journalEntries = [
            { id: Date.now()+1, pair: "BTC/USD", profitLoss: 320, dateISO: new Date(Date.now() - 86400000*2).toISOString(), timestamp: Date.now() - 86400000*2 },
            { id: Date.now()+2, pair: "ETH/USD", profitLoss: -85, dateISO: new Date(Date.now() - 86400000).toISOString(), timestamp: Date.now() - 86400000 },
            { id: Date.now()+3, pair: "XAU/USD", profitLoss: 210, dateISO: new Date().toISOString(), timestamp: Date.now() }
        ];
        saveJournal();
        const premiumStatus = localStorage.getItem("traderx_premium");
        isPremium = premiumStatus === "true";
        const savedName = localStorage.getItem("traderx_name");
        if(savedName) userName = savedName;
        const savedEmail = localStorage.getItem("traderx_email");
        if(savedEmail) userEmail = savedEmail;
        signalsArray = buildSignals();
        initActivitiesLog();
    }
    function saveJournal() { localStorage.setItem("traderx_journal", JSON.stringify(journalEntries)); }
    function setPremium(value) { isPremium = value; localStorage.setItem("traderx_premium", value); renderAllPages(); showToast(value ? "🎉 PREMIUM UNLOCKED! Full access" : "Free tier activated"); }
    function saveUserName(name) { userName = name; localStorage.setItem("traderx_name", name); renderProfilePage(); renderHomePage(); }
    function initActivitiesLog() { activities = ["📈 Welcome back! Track your performance", "🎯 Premium unlocks exclusive signals"]; if(journalEntries.length) activities.unshift(`📊 ${journalEntries.length} trades logged`); }
    function addActivity(msg) { activities.unshift(msg); if(activities.length>8) activities.pop(); renderHomePage(); }
    function getTotalPnL() { return journalEntries.reduce((sum, t) => sum + (t.profitLoss || 0), 0); }
    function getTodayPnL() { const todayStart = new Date(); todayStart.setHours(0,0,0,0); return journalEntries.filter(t => new Date(t.dateISO) >= todayStart).reduce((sum, t) => sum + t.profitLoss, 0); }
    function getWinRate() { if(journalEntries.length === 0) return 0; const wins = journalEntries.filter(t => t.profitLoss > 0).length; return (wins / journalEntries.length * 100).toFixed(1); }
    function getCurrentBalance() { return balanceStarting + getTotalPnL(); }
    function getCumulativeBalanceData() {
        let sorted = [...journalEntries].sort((a,b) => a.timestamp - b.timestamp);
        let cumulative = balanceStarting;
        let points = [{label: 'Start', balance: cumulative}];
        sorted.forEach(t => { cumulative += t.profitLoss; points.push({label: t.pair, balance: cumulative}); });
        if(points.length === 1) points.push({label: 'Now', balance: cumulative});
        return points;
    }
    function updateBalanceChart() {
        const canvas = document.getElementById("balanceChartCanvas");
        if(!canvas) return;
        const ctx = canvas.getContext("2d");
        const dataPoints = getCumulativeBalanceData();
        const labels = dataPoints.map(p => p.label.length>8 ? p.label.slice(0,6) : p.label);
        const balances = dataPoints.map(p => p.balance);
        if(chartInstance) chartInstance.destroy();
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: { labels, datasets: [{ label: 'Portfolio ($)', data: balances, borderColor: '#00E6B2', backgroundColor: 'rgba(0,230,178,0.05)', borderWidth: 3, pointRadius: 3, fill: true }] },
            options: { responsive: true, maintainAspectRatio: true }
        });
    }
    function addTrade(pair, profitLossNum) {
        const newTrade = { id: Date.now(), pair, profitLoss: profitLossNum, dateISO: new Date().toISOString(), timestamp: Date.now() };
        journalEntries.push(newTrade);
        saveJournal();
        addActivity(`📝 ${pair} ${profitLossNum>=0 ? '+' : ''}$${profitLossNum.toFixed(2)}`);
        showToast(profitLossNum>0 ? `✅ Profit +$${profitLossNum.toFixed(2)}` : `⚠️ Loss $${Math.abs(profitLossNum).toFixed(2)}`);
        renderAllPages();
        updateBalanceChart();
    }
    function deleteTrade(id) { journalEntries = journalEntries.filter(t => t.id !== id); saveJournal(); addActivity(`🗑️ Trade removed`); renderAllPages(); updateBalanceChart(); }

    // Render Functions (home, signals, journal, news, profile, education)
    function renderHomePage() { /* same as previous but keep concise */ 
        const homeDiv = document.getElementById("homePage");
        const balance = getCurrentBalance(), todayPnL = getTodayPnL(), totalPnL = getTotalPnL(), winrate = getWinRate();
        const premiumBadge = isPremium ? '<span class="badge" style="background:#FFB34720;color:#FFB347;">⭐ PREMIUM</span>' : '<span class="badge">🔓 FREE</span>';
        const visibleSignals = signalsArray.slice(0, 3).map(s => `<div class="signal-item"><span><b>${s.pair}</b> ${s.status}</span><span>${s.entry}</span></div>`).join('');
        const activityHtml = activities.slice(0,4).map(a => `<div class="flex-between"><span>🔔 ${a}</span></div>`).join('');
        homeDiv.innerHTML = `
            <div class="card"><div class="flex-between"><div><h2>Welcome back, ${userName}</h2>${premiumBadge}</div><i class="fas fa-chart-simple" style="font-size:28px;color:#2A6DFF;"></i></div></div>
            <div class="card"><div class="flex-between"><span>💰 Balance</span><span class="profit-text">$${balance.toFixed(2)}</span></div>
            <div class="flex-between"><span>📈 Profit Today</span><span class="${todayPnL>=0?'profit-text':'loss-text'}">${todayPnL>=0?'+':''}$${todayPnL.toFixed(2)}</span></div>
            <div class="flex-between"><span>📊 Total PnL</span><span class="${totalPnL>=0?'profit-text':'loss-text'}">${totalPnL>=0?'+':''}$${totalPnL.toFixed(2)}</span></div><hr>
            <div class="flex-between"><span>🏆 Winrate</span><span>${winrate}%</span></div></div>
            <div class="card"><canvas id="balanceChartCanvas" height="160"></canvas></div>
            <div class="card"><h3>🔥 Latest Signals</h3>${visibleSignals}<button class="badge" id="gotoSignalsQuick" style="margin-top:8px;">View all →</button></div>
            <div class="card"><h3>📺 Trading Videos</h3><div class="scroll-x" id="videoFeedHome"></div></div>
            <div class="card"><h3>⚡ Activity Feed</h3>${activityHtml}</div>
            <div class="grid-2"><button class="glass-btn primary" id="quickAddTradeBtn"><i class="fas fa-plus-circle"></i> Add Trade</button>
            <button class="glass-btn" id="quickSignalsBtn"><i class="fas fa-bullhorn"></i> Signals</button>
            <button class="glass-btn" id="quickCalcBtn"><i class="fas fa-calculator"></i> Calculator</button>
            <div id="watchlistMini" class="glass-btn" style="background:#121A2A;">📊 Watchlist</div></div>`;
        document.getElementById("quickAddTradeBtn")?.addEventListener("click", openAddTradeModal);
        document.getElementById("quickSignalsBtn")?.addEventListener("click", ()=>switchPage("signals"));
        document.getElementById("quickCalcBtn")?.addEventListener("click", openCalculatorModal);
        document.getElementById("gotoSignalsQuick")?.addEventListener("click", ()=>switchPage("signals"));
        renderVideoFeed("videoFeedHome", eduVideos);
        renderWatchlistOnHome();
        updateBalanceChart();
    }
    function renderWatchlistOnHome() { const w = document.getElementById("watchlistMini"); if(w) w.innerHTML = `<div><i class="fas fa-chart-line"></i> BTC: $${marketPrices.BTC.toFixed(0)} | GOLD: $${marketPrices.GOLD.toFixed(1)}</div>`; }
    function renderVideoFeed(containerId, videosArray) { const cont = document.getElementById(containerId); if(cont) cont.innerHTML = videosArray.map(v => `<div class="video-card"><iframe src="https://www.youtube.com/embed/${v.id}?autoplay=0&mute=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe><div style="padding:8px">${v.title}</div></div>`).join(''); }
    function renderSignalsPage() { const cont = document.getElementById("signalsPage"); let sorted = [...signalsArray].sort((a,b)=>b.createdAt - a.createdAt); let html = sorted.map(sig => { if(sig.premiumLocked && !isPremium) return `<div class="signal-item locked-signal" style="filter: blur(3px);"><div><i class="fas fa-lock"></i> ${sig.pair} 🔒</div><div>Premium signal</div></div>`; return `<div class="signal-item"><div><b>${sig.pair}</b><div><small>Entry:${sig.entry} TP:${sig.tp} SL:${sig.sl}</small></div></div><span class="badge">${sig.status}</span></div>`; }).join(''); if(!isPremium) html += `<div class="card" style="text-align:center"><button class="glass-btn primary" id="upgradeFromSignals">Upgrade Now</button></div>`; cont.innerHTML = `<div class="card"><h2>📡 Trading Signals</h2></div>${html}`; document.getElementById("upgradeFromSignals")?.addEventListener("click", ()=>{ setPremium(true); renderSignalsPage(); }); }
    function renderJournalPage() { /* similar as before */ const cont = document.getElementById("journalPage"); const totalTrades = journalEntries.length, winrate = getWinRate(), totalPnl = getTotalPnL(); let tradesList = journalEntries.slice().reverse().map(t => `<div class="journal-item"><div><b>${t.pair}</b> <span class="${t.profitLoss>=0?'profit-text':'loss-text'}">${t.profitLoss>=0?'+':''}$${t.profitLoss.toFixed(2)}</span><div><small>${new Date(t.dateISO).toLocaleDateString()}</small></div></div><button class="deleteTradeBtn" data-id="${t.id}"><i class="fas fa-trash-alt"></i></button></div>`).join(''); cont.innerHTML = `<div class="card"><div class="flex-between"><span>📊 Stats</span><span>Total: ${totalTrades}</span></div><div>WinRate: ${winrate}% | Total PnL: ${totalPnl>=0?'+':''}$${totalPnl.toFixed(2)}</div></div><div class="card"><h3>➕ Add Trade</h3><input id="journalPair" placeholder="Pair"><input id="journalPL" type="number" placeholder="Profit/Loss"><button class="glass-btn primary" id="submitTradeBtn">Add</button></div><div class="card"><h3>History</h3>${tradesList}</div>`; document.getElementById("submitTradeBtn")?.addEventListener("click",()=>{ let pair=document.getElementById("journalPair").value, pl=parseFloat(document.getElementById("journalPL").value); if(pair && !isNaN(pl)) addTrade(pair,pl); else showToast("Invalid"); renderJournalPage();}); document.querySelectorAll(".deleteTradeBtn").forEach(btn=>btn.addEventListener("click",(e)=>{deleteTrade(parseInt(btn.dataset.id)); renderJournalPage();}));}
    function renderNewsPage() { const cont = document.getElementById("newsPage"); cont.innerHTML = `<div class="card"><h3>📰 News Feed</h3>${newsData.map(n=>`<div class="flex-between" style="margin-bottom:12px"><img src="${n.image}" width="40" height="40" style="border-radius:12px"><div><b>${n.title}</b><br><small>${n.source} ${n.date}</small></div></div>`).join('')}</div>`; }

    function renderProfilePage() { const cont = document.getElementById("profilePage"); cont.innerHTML = `<div class="card" style="text-align:center"><i class="fas fa-user-circle fa-4x"></i><h2>${userName}</h2><p>${userEmail}</p><span class="badge">${isPremium?"PREMIUM":"FREE"}</span></div><div class="card"><label>Edit Name</label><input id="editNameInput" value="${userName}"><button class="glass-btn primary" id="saveNameBtn">Save</button><hr><button class="glass-btn" id="upgradeProfileBtn">${isPremium?"Already Premium":"Upgrade to Premium"}</button><button class="glass-btn" id="logoutBtn">Logout</button></div>`; document.getElementById("saveNameBtn")?.addEventListener("click",()=>{ let newName=document.getElementById("editNameInput").value; if(newName) saveUserName(newName); renderProfilePage(); }); document.getElementById("upgradeProfileBtn")?.addEventListener("click",()=>setPremium(true)); document.getElementById("logoutBtn")?.addEventListener("click",()=>{ localStorage.removeItem("traderx_logged"); localStorage.removeItem("traderx_premium"); localStorage.removeItem("traderx_name"); window.location.reload(); }); }
    function openAddTradeModal() { /* modal simplified */ const modalDiv = document.createElement("div"); modalDiv.className="modal"; modalDiv.innerHTML=`<div class="modal-content"><h3>Add Trade</h3><input id="modalPair" placeholder="Pair"><input id="modalPL" type="number" placeholder="P/L $"><div class="flex-between"><button id="closeModal">Cancel</button><button class="primary" id="confirmModalTrade">Add</button></div></div>`; document.body.appendChild(modalDiv); document.getElementById("closeModal")?.addEventListener("click",()=>modalDiv.remove()); document.getElementById("confirmModalTrade")?.addEventListener("click",()=>{ let p=document.getElementById("modalPair").value, pl=parseFloat(document.getElementById("modalPL").value); if(p && !isNaN(pl)){ addTrade(p,pl); modalDiv.remove(); renderJournalPage(); } else showToast("Invalid"); }); }
    function openCalculatorModal() { const modalDiv = document.createElement("div"); modalDiv.className="modal"; modalDiv.innerHTML=`<div class="modal-content"><h3>Risk Calculator</h3><label>Balance</label><input id="calcBalance" value="${getCurrentBalance().toFixed(0)}"><label>Risk %</label><input id="calcRisk" value="1.5"><div>Lot size: <span id="lotResult">0.00</span></div><button id="closeCalc">Close</button></div>`; document.body.appendChild(modalDiv); function update(){ let bal=parseFloat(document.getElementById("calcBalance").value)||0; let risk=parseFloat(document.getElementById("calcRisk").value)||0; let lot=(bal*risk/100)/100000; document.getElementById("lotResult").innerText=lot.toFixed(3);} document.getElementById("calcBalance")?.addEventListener("input",update); document.getElementById("calcRisk")?.addEventListener("input",update); update(); document.getElementById("closeCalc")?.addEventListener("click",()=>modalDiv.remove()); }
